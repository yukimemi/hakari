# renri.toml — language-agnostic worktree config for projects using these templates.
# pj-base ships the minimum hook chain that any PJ benefits from
# (refresh installed agent skills); language-specific layers
# (pj-rust, pj-go, pj-bun) overwrite this file with a richer hook
# that delegates to the project's build-system on-add task.

[ui]
# Surface the GitHub PR # next to each worktree in `renri list`.
# renri batches `gh pr list` lookups (one call per `list` run
# regardless of worktree count) and caches the result; pass
# `renri list --refresh` to bypass the cache when a new PR has
# just been opened or merged.
show_pr = true
# renri.toml — fresh worktrees refresh agent skills, install
# Node deps, and fetch upstream so the new worktree is
# rebase-ready in one go. Ordering matters: `apm install --update`
# first (so the latest renri skill is in place before anything
# else runs), then `pnpm install` (so node_modules are ready
# before the consumer hits any local script), then `vcs-fetch`
# (best-effort remote refresh).
# Schema and examples: https://github.com/yukimemi/renri

[[hooks.post_create]]
type = "command"
run = "apm install --update -t copilot,claude,gemini"
shell = "auto"

[[hooks.post_create]]
type = "command"
run = "pnpm install"
shell = "auto"

[[hooks.post_create]]
type = "command"
# Best-effort: a missing remote / no upstream / pure-jj workspace
# without a git remote shouldn't break `renri add`.
run = "git fetch || true"
shell = "auto"

# Project-local: `.env` is git-ignored, so a fresh worktree starts
# without the Firebase config and the app boots straight into
# "Firebase の設定が必要です". Copied from the main checkout, which
# is where `type = "copy"` reads from.
#
# Only `.env`: a copy hook errors on a missing source rather than
# skipping it, so anything listed here has to be a file every
# checkout is documented to have. `.env` is that file (README's
# `cp .env.example .env`); a personal `.env.local` is not.
#
# This sits after the kata-owned three on purpose — pj-pnpm owns
# `hooks.post_create[0..2]` by index, and an entry placed before
# them would be overwritten by the next `kata apply`.
[[hooks.post_create]]
type = "copy"
files = [".env"]
