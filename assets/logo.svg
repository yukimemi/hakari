<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 128" width="470" height="128"
     role="img" aria-label="hakari — 秤. measure, then move">
  <!-- Light-background version. The dark one is assets/logo-dark.svg and
       the README picks between them with <picture>.

       The mark is the steelyard beam the whole app is designed around: a
       graduated rod with a needle standing on it. Vermilion is reserved
       for the reading here exactly as it is in the interface — nothing
       else is allowed to use it, so the eye always knows where the
       measurement is. -->

  <g stroke-linecap="round">
    <line x1="14" y1="66" x2="118" y2="66" stroke="#9aa3ab" stroke-width="6.5"/>

    <g stroke="#b9c0c7" stroke-width="2.5">
      <line x1="24" y1="73" x2="24" y2="85"/>
      <line x1="40" y1="73" x2="40" y2="80"/>
      <line x1="56" y1="73" x2="56" y2="85"/>
      <line x1="72" y1="73" x2="72" y2="80"/>
      <line x1="88" y1="73" x2="88" y2="85"/>
      <line x1="104" y1="73" x2="104" y2="80"/>
    </g>

    <line x1="48" y1="58" x2="48" y2="74" stroke="#d93e28" stroke-width="5"/>
  </g>
  <path d="M48 59.5 L37.5 35 L58.5 35 Z" fill="#d93e28"/>

  <text x="142" y="74" font-family="Archivo, 'Segoe UI', system-ui, sans-serif"
        font-size="60" font-weight="700" letter-spacing="-1.5" fill="#16191c">hakari</text>
  <text x="145" y="101" font-family="'Noto Sans JP', system-ui, sans-serif"
        font-size="15" font-style="italic" letter-spacing="1.6" fill="#6e7780">秤 — measure, then move</text>
</svg>
